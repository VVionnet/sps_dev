variables:
  ORD_SOUMET_SHELL: "/bin/bash"
  ORD_SOUMET_CPUS: "80"
  ORD_SOUMET_TMPFS: "10G"
  ORD_SOUMET_M: "100G"
  ORD_SOUMET_W: "60"
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - build
  - run_intel
  - run_gnu
  - package
  - deploy

before_script:
  - source ~/ci-admin/env/init.sh
  - export PIPELINE_SUBDIR=${ECCI_BUILD_DIR}/precaution/${CI_PROJECT_PATH}/${CI_COMMIT_REF_NAME}/${CI_PIPELINE_ID}

#----- rhel-9-graniterapids-64-intel-2025.1.0
# U3 Intel 2025 with installed RPN-SI libs
build:rhel-9-graniterapids-64-intel-2025.1.0:
  variables:
     ORD_SOUMET_MACH: ppp6t
     ORD_SOUMET_CPUS: "4"
     ORD_SOUMET_W: "30"
     ORD_SOUMET_M: "8G"
     ORD_SOUMET_TMPFS: "1G"
  stage: build
  tags:
    - concurrent
  when: always
  script:
    - set +e
    - . r.env.dot --carch graniterapids
    - . ./.eccc_setup_intel_2025.1.0
    - set -e
    - mkdir -pv ${PIPELINE_SUBDIR}/build-rhel-9-graniterapids-64-intel-2025.1.0
    - mkdir -pv ${PIPELINE_SUBDIR}/work-rhel-9-graniterapids-64-intel-2025.1.0
    - ln -sf ${PIPELINE_SUBDIR}/work-rhel-9-graniterapids-64-intel-2025.1.0 .
    - SRC_DIR=$(pwd)
    - cd ${PIPELINE_SUBDIR}/build-rhel-9-graniterapids-64-intel-2025.1.0
    - cmake -DTARGET_PROC=graniterapids ${SRC_DIR}
    - time make -j $NCPUS
    - time make work
  artifacts:
    expire_in: 4 hrs
    paths:
    - work-rhel-9-graniterapids-64-intel-2025.1.0

package:rhel-9-graniterapids-64-intel-2025.1.0:
   variables:
      ORD_SOUMET_MACH: ppp6t
      ORD_SOUMET_CPUS: "2"
      ORD_SOUMET_W: "10"
      ORD_SOUMET_M: "8G"
      ORD_SOUMET_TMPFS: "1G"
   stage: package
   tags:
      - concurrent
   only:
      - tags
      - /^dev_6\.[0-9]*$/
      - schedules
   dependencies:
      - build:rhel-9-graniterapids-64-intel-2025.1.0
   script:
      - set +e
      - . r.env.dot --carch graniterapids
      - . ./.eccc_setup_intel_2025.1.0
      - set -e
      - cd ${PIPELINE_SUBDIR}/build-rhel-9-graniterapids-64-intel-2025.1.0
      - make package
      - ~/ci-admin/bin/ci-package-ssm.sh package ${ECCI_PROCESS}

