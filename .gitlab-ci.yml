variables:
  ORD_SOUMET_SHELL: "/bin/bash"
  ORD_SOUMET_CPUS: "4"
  ORD_SOUMET_TMPFS: "1G"
  ORD_SOUMET_M: "8G"
  ORD_SOUMET_W: "30"
  GIT_SUBMODULE_STRATEGY: none

stages:
  - build
  - run_intel
  - run_gnu
  - package
  - deploy

before_script:
  - source ~/ci-admin/env/init.sh
  - export PIPELINE_SUBDIR=${ECCI_BUILD_DIR}/precaution/${CI_PROJECT_PATH}/${CI_BUILD_REF_NAME}/${CI_PIPELINE_ID}

#----- rhel-8-amd64_gnu-9.3.0
build:rhel-8-amd64_gnu-9.3.0:
  variables:
     ORD_SOUMET_CPUS: "4"
     ORD_SOUMET_W: "30"
     ORD_SOUMET_M: "8G"
     ORD_SOUMET_TMPFS: "1G"
  stage: build
  tags:
    - concurrent
  when: always
  script:
    - set +e
    - . ${ECCI_ENV}/latest/profile.sh
    - . ./.eccc_setup_gnu
    - set -e
    - mkdir -pv ${PIPELINE_SUBDIR}/build-rhel-8-amd64-64-gnu-9.3.0
    - mkdir -pv ${PIPELINE_SUBDIR}/work-rhel-8-amd64-64-gnu-9.3.0
    - ln -sf ${PIPELINE_SUBDIR}/work-rhel-8-amd64-64-gnu-9.3.0 .
    - SRC_DIR=$(pwd)
    - cd ${PIPELINE_SUBDIR}/build-rhel-8-amd64-64-gnu-9.3.0
    - cmake -DWITH_SYSTEM_RPN=TRUE ${SRC_DIR}
    - time make -j $NCPUS
    - time make work

#----- rhel-8-amd64_gnu-12.1.0
build:rhel-8-amd64_gnu-12.1.0:
  variables:
     ORD_SOUMET_CPUS: "4"
     ORD_SOUMET_W: "30"
     ORD_SOUMET_M: "8G"
     ORD_SOUMET_TMPFS: "1G"
  stage: build
  tags:
    - concurrent
  when: always
  script:
    - set +e
    - . ${ECCI_ENV}/latest/profile.sh
    - . ./.eccc_setup_gnu_12
    - git submodule update --recursive --init
    - set -e
    - mkdir -pv ${PIPELINE_SUBDIR}/build-rhel-8-amd64-64-gnu-12.1.0
    - SRC_DIR=$(pwd)
    - cd ${PIPELINE_SUBDIR}/build-rhel-8-amd64-64-gnu-12.1.0
    - cmake -DWITH_SYSTEM_RPN=FALSE ${SRC_DIR}
    - time make -j $NCPUS
  allow_failure: true

#----- rhel-8-icelake-64-intel-2022.1.2
# U2 Intel 2022 with RPN-SI sources
