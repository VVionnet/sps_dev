#----- Running test configuration for rhel-8-icelake-64-intel-2022.1.2
SPS_cfgs_intel:
  stage: run_intel
  dependencies:
  - build:rhel-8-icelake-64-intel-2022.1.2
  when: always
  only:
  - dev
  - tags
  allow_failure: true
  script:
    - . ${ECCI_ENV}/latest/profile.sh
    - . ./.eccc_setup_intel
    - ./scripts/link-dbase.sh
    - cd $SPS_WORK
    - sps.sh --dircfg ./configurations/SPS_cfgs --ptopo 2x2x1 --inorder

