#----- Running test configurations for rhel-8-icelake-64-intel-2025.1.0
caldas_hrdps_isba_intel:
  stage: run_intel
  needs:
  - build:rhel-8-icelake-64-intel-2025.1.0
  when: always
  allow_failure: true
  script:
    - set +e
    - . ./.eccc_setup_intel_2025.1.0
    - . ssmuse-sh -d /fs/ssm/eccc/cmo/isst/maestro/20230316
    - set -e
    - ./scripts/link-dbase.sh
    - cd $SPS_WORK
    - sps.sh --dircfg ./configurations/caldas_hrdps_isba --ptopo=6x1 --btopo=1x1 --inorder

